<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #090d16 0%, #0e1726 50%, #151e33 100%); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient and Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 {
        animation: float1 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: float2 7s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-circle {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashAnim 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="none"/>
  <rect width="100%" height="100%" fill="url(#glow1)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>

  <!-- Decorative Background Grid Lines & Orbit Elements -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <circle cx="1060" cy="170" r="120" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="1060" cy="170" r="80" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Left Interactive / Animated Flow Graphic (Background to Title) -->
  <g class="pulse-circle" opacity="0.4">
    <circle cx="120" cy="80" r="40" fill="#3b82f6" />
    <circle cx="1080" cy="260" r="60" fill="#8b5cf6" />
  </g>

  <!-- Animated Connection Line -->
  <path d="M 940 100 Q 1010 140 1060 170 T 980 260" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.5"/>

  <!-- Dynamic Floating Decorative Cards (Positioned on the side so they don't cover title/subtitle) -->
  <g class="floating-card-1" filter="url(#shadow)">
    <!-- Clause Card 1 -->
    <rect x="910" y="45" width="240" height="90" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="925" y="60" width="28" height="28" rx="6" fill="#1e3a8a" />
    <text x="939" y="79" font-size="16" fill="#60a5fa" font-weight="bold" text-anchor="middle">§</text>
    <text x="965" y="74" fill="#f1f5f9" font-size="13" font-weight="600">Standard Indemnity</text>
    <text x="965" y="91" fill="#94a3b8" font-size="10">Fallback Tier A • Approved</text>
    <rect x="925" y="103" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="960" y="116" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">Pre-Approved</text>
    <rect x="1005" y="103" width="80" height="18" rx="9" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="1045" y="116" fill="#60a5fa" font-size="10" font-weight="bold" text-anchor="middle">AI Redlined</text>
  </g>

  <g class="floating-card-2" filter="url(#shadow)">
    <!-- Clause Card 2 -->
    <rect x="880" y="180" width="250" height="96" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="895" y="196" width="28" height="28" rx="6" fill="#4c1d95" />
    <text x="909" y="215" font-size="15" fill="#c084fc" font-weight="bold" text-anchor="middle">⚖️</text>
    <text x="933" y="210" fill="#f1f5f9" font-size="13" font-weight="600">Limitation of Liability</text>
    <text x="933" y="227" fill="#94a3b8" font-size="10">Automated Risk Analysis</text>
    <rect x="895" y="240" width="85" height="18" rx="9" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="937" y="253" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Mutual 1x Cap</text>
    <rect x="990" y="240" width="85" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="1032" y="253" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">Git-Versioned</text>
  </g>

  <!-- Foreground Title and Content (Unobstructed & Clean) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="5" fill="#3b82f6" />
      <text x="30" y="20" fill="#93c5fd" font-size="12" font-weight="600" letter-spacing="0.5">LEGAL PLAYBOOKS &amp; CLM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Legal Clause Library
    </text>

    <!-- Subtitle (Category & Breadth) -->
    <text x="0" y="172" fill="#cbd5e1" font-size="22" font-weight="500">
      &amp; Standard Clauses Directory
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="218" fill="#94a3b8" font-size="14.5" font-weight="400">
      Enterprise CLM Clause Management, AI Playbooks, Fallback Positions &amp; Open-Source Legal Stacks
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 248)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle">📜 Clause Banks</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="214.5" y="18" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle">🤖 AI Redlining</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="376.5" y="18" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle">🛡️ Fallback Logic</text>

      <!-- Tag 4 -->
      <rect x="466" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="548.5" y="18" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle">⚡ Smart Contracts</text>
    </g>
  </g>
</svg>
